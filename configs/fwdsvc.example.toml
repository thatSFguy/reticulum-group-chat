# reticulum-group-chat config.

# admins / mods are LXMF DESTINATION hashes (16 raw bytes / 32 hex chars,
# specifically the lxmf.delivery destination hash of the user's identity —
# NOT the raw identity hash).
#
# The simplest way to find a user's destination hash: have them message
# the service once. The forwarder logs `new sender contact: full
# dest_hash = ...` on first contact. Copy that into this list and
# restart.
#
# admins / mods MUST be at the TOP of the file, before any [section]
# header — TOML scopes top-level keys to whichever section is
# currently active.
admins = [
  # "00112233445566778899aabbccddeeff",
]
mods = [
  # "ffeeddccbbaa99887766554433221100",
]

[service]
# Shown in our LXMF announces. Visible to all Reticulum nodes.
display_name = "Group Chat - send /join"

# Where to store the service's identity, roster, and replay buffer.
# Tilde is expanded.
identity_path = "~/.fwdsvc/identity"
state_path    = "~/.fwdsvc/state.json"
history_path  = "~/.fwdsvc/history.json"

# Optional: paste the base64 form of your 64-byte identity here to make
# this config file the single source of truth for your service identity.
# When set, identity_path is ignored on startup. Useful so a reinstall
# that only preserves config.toml still keeps the same identity (and
# therefore the same delivery destination hash everyone in your roster
# already knows).
#
# On first run with no identity, fwdsvc generates one and writes the
# base64 form to ~/.fwdsvc/identity.b64.txt — copy the contents of that
# file here to enable backup. Treat as a SECRET; anyone with this string
# is your service.
#identity_b64 = "PASTE-BASE64-FROM-identity.b64.txt-HERE"

# Drop a user from the roster if we haven't heard an announce or message from
# them in this long.
prune_after = "4w"

# Drop a member who hasn't sent a chat message in this long, EVEN IF their
# Reticulum client is still announcing or they run the occasional command.
# Catches lurkers who joined and went quiet (prune_after counts announces
# and commands as activity, so it never sweeps them). Note: /join resets
# this clock. Set larger than prune_after. 0 disables the silent sweep.
prune_silent_after = "6w"

# How often to run the prune sweep.
prune_interval = "1h"

# How often to re-broadcast our own announce so other Reticulum nodes
# can learn / refresh our path. Upstream Python rnsd uses 5-15 minutes.
announce_interval = "10m"

# Maximum number of UTF-8 characters allowed in an inbound message from
# a roster member. Messages longer than this are rejected with a polite
# reply to the sender; the message is not forwarded and not added to
# history. Spam-prevention policy limit, separate from the lower wire-
# format size cap (~280 bytes). Set to 0 to disable.
max_inbound_chars = 500

# --- Attachments -----------------------------------------------------
#
# Whether non-text LXMF fields (images, files, audio, and the message-
# meta fields that carry reactions and replies) are forwarded at all.
# false forwards the text body only.
forward_attachments = true

# Per-field cap on the msgpack-encoded size of any single allowed field.
# An oversize attachment is dropped and the forwarded body gets an
# inline "[image not forwarded: 2.1 MB > 1000 KB limit]" note, so the
# text still arrives and everyone can see something was trimmed. 0
# disables the cap (not recommended on LoRa).
max_attachment_bytes = 1024000

# Allowlist of LXMF field keys to forward. This is flood defense as much
# as feature selection: it is what stops a client stuffing arbitrary
# payloads through the fan-out, which multiplies by roster size.
#
#     5  = FIELD_FILE_ATTACHMENTS      6  = FIELD_IMAGE
#     7  = FIELD_AUDIO                48  = FIELD_REPLY_TO (0x30)
#    49  = FIELD_REPLY_QUOTE (0x31)   64  = FIELD_REACTION (0x40)
#    65  = FIELD_COMMENT (0x41)       66  = FIELD_CONTINUATION (0x42)
#
# The default omits 5 and 7, so files and voice clips do NOT pass. A
# sender who attaches one gets a private reply telling them the group
# does not accept that kind — the attachment is refused, never silently
# swallowed. Add them here if your members want them:
#
#     forwarded_fields = [5, 6, 7, 48, 49, 64, 65, 66]
#
# 251 and 252 are refused outright: they are the relay's own attribution
# fields, and forwarding attacker-supplied values would let a message
# carry a forged "who reacted" that cooperating clients render.
forwarded_fields = [6, 48, 49, 64, 65, 66]

# Maximum number of members in the chat. /join attempts past this cap
# are refused with a "the chat is full" reply; existing and paused
# members both count toward the limit.
#
# Defaults to 512 rather than unlimited: in an open group anyone can
# generate identities and /join, and roster size multiplies every
# fan-out (one queued message per member per message, a replay burst on
# each join). Prune runs hourly against multi-week windows, so it is no
# defense against a burst. Set to 0 for genuinely unlimited.
max_members = 512

# How long to remember an inbound message's ID so a message Reticulum
# delivers more than once (multiple paths, retransmits, or a propagation
# node replaying it) is forwarded to the roster only once. This is the
# main defense against duplicate/echoed messages. Two genuinely different
# messages never collide (the ID includes the sender's timestamp). Set to
# 0 to disable. Default "1h".
dedup_window = "1h"

# Make the chat invite-only. When true, /join from a regular user is
# refused with a "closed group" reply (which echoes them their own
# address to hand to an admin), and the only way into the roster is an
# admin or mod running `/adduser <hash>`. The added user is welcomed and
# replayed automatically. `/removeuser <user>` takes them back out; in a
# locked chat they can't return until re-added. Config admins/mods always
# bypass the gate, so you can't lock yourself out. Default false (open
# chat: anyone with the destination hash can /join).
locked = false

# Reticulum I/O interfaces. Currently only "tcp_client" is supported, which
# dials a TCPServerInterface peer (e.g. a public testnet entry node) and
# exchanges HDLC-framed packets in both directions. You can list multiple.
[[interfaces]]
type = "tcp_client"
# rns.michmesh.net is one community-run testnet entry node — replace with
# whatever Reticulum peer you'd like to connect through (a local rnsd, a
# different community node, etc).
addr = "rns.michmesh.net:7822"
# Optional dial timeout; 0 = stdlib default (~30s).
timeout = "10s"

# A second interface (LAN peer, your own rnsd, etc.) — uncomment as needed.
#[[interfaces]]
#type = "tcp_client"
#addr = "10.0.0.42:4242"

[replay]
# When a new (or returning) user joins, replay this many recent messages to
# them, skipping anything older than max_age. Set count = 0 to disable
# replay entirely.
count   = 100
max_age = "7d"

[propagation]
# Store-and-forward delivery via LXMF propagation nodes. When enabled,
# messages the service can't deliver directly (recipient offline or
# unreachable) are handed to a propagation node; the recipient's client
# (Sideband etc.) picks them up on its next sync instead of the message
# being dropped after the direct retry budget runs out.
enabled = false

# Delivery strategy:
#   "fallback" (default) — try direct delivery first; only messages whose
#     direct retries are exhausted get re-routed via the propagation node.
#   "always" — every outbound message goes to the propagation node only;
#     members receive everything on their next sync (higher latency, but
#     nothing is ever dropped for being offline).
mode = "fallback"

# IMPORTANT: in fallback mode the direct retry budget is SPLIT, and this
# setting is why sends can fail over before the standard 5 attempts:
#   - While a propagation node is available, direct delivery gets only
#     `direct_attempts` tries (default 3) before the message is handed
#     to the node — failing fast into the safety net puts an offline
#     member's mail on the node in ~75s instead of ~3.5 minutes.
#   - Whenever NO node is known (none discovered / none accepting), the
#     full 5-attempt budget still applies before a message is given up
#     on — the shortened budget never risks dropping mail.
# The startup log prints both numbers. Set to 5 to disable the
# shortening and always use the full budget.
direct_attempts = 3

# Optional: pin a specific propagation node by its lxmf.propagation
# destination hash (32 hex chars).
#
# MOST OPERATORS SHOULD LEAVE THIS UNSET. Pin it only when you know
# the node your members actually sync from — your own, or one the
# group agreed on and whose hash you were handed directly.
#
# Why: store-and-forward only completes when the recipient FETCHES the
# message. Pinning makes that deterministic ONLY if everyone shares the
# node. One instance's log over five weeks saw 632 distinct nodes
# accepting messages, so pinning a node your members don't poll fixes
# nothing — it just picks which stranger stores the mail.
#
# Worse, 215 of those 632 flapped between accepting and refusing
# messages. A pinned node is used unconditionally with NO failover, so
# pinning a flapper makes store-and-forward silently intermittent.
# Auto-selection re-checks the accepting flag every time it picks.
#
# Note you cannot identify a node from its announce: SPEC §5.8.5 puts
# the 7-element parameter array in app_data, not a name, so propagation
# announces are anonymous (all 2200 observed had an empty display
# name). The hash has to come from the operator.
#
# Leave empty to auto-select: among nodes that are accepting and whose
# announced parameters we can satisfy, the one we have known LONGEST
# and heard from recently wins. That resists a newcomer flooding
# announces to seize the role, and favors uptime — the only useful
# property left once you can't tell which node your members use.
#
# Either way, with a mixed membership treat store-and-forward as
# best-effort: past the upload, delivery depends on nodes syncing with
# each other, which no setting here controls. In fallback mode that is
# still strictly better than nothing. See the README for the trust
# notes and the full reasoning.
#node = "00112233445566778899aabbccddeeff"

# (admins / mods are now at the top of the file — see the comment block
# at the start. They MUST be top-level keys before any [section] header.)
