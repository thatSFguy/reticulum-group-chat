name: release

# Builds the cross-compiled fwdsvc binaries and attaches them to the
# GitHub release whenever one is published. The README's install
# section points users at these assets; before this workflow they were
# uploaded by hand and had been missing since v1.4.0.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for"
        required: true

permissions:
  contents: write

jobs:
  binaries:
    name: build + attach binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build all release targets
        run: bash scripts/build-all.sh

      - name: Checksums
        run: |
          cd build
          sha256sum fwdsvc-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$tag" build/fwdsvc-* build/SHA256SUMS --clobber
