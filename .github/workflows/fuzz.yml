name: fuzz

# Scheduled rather than per-push. Fuzzing is a randomized search: its
# value comes from cumulative machine-time, not from running on every
# commit, and time-boxed runs report a deadline overrun as failure on
# contended runners — which would gate merges on a coin flip. Seed
# corpora still run on every push as ordinary tests.
on:
  schedule:
    - cron: "17 4 * * *" # nightly, off-peak
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Duration per target (e.g. 10m)"
        required: false
        default: "10m"

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One entry per fuzz target. ValidateMsgpackBounds stands in
        # front of every attacker-controlled decode in the service, so
        # it earns the machine time.
        include:
          - pkg: ./internal/rns/
            target: FuzzValidateMsgpackBounds
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fuzz
        id: fuzz
        run: |
          go test ${{ matrix.pkg }} -run=XXX \
            -fuzz=${{ matrix.target }} \
            -fuzztime=${{ inputs.fuzztime || '10m' }}

      # A crasher is written to testdata/fuzz/<target>/. Upload it so the
      # reproducer survives the runner — without this the input that
      # found the bug is lost when the job ends.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore
